name: Publish APT Repo (GitHub Pages)

# Builds the deb and publishes a signed APT repo to the gh-pages branch, served at
# https://<owner>.github.io/<repo>/. Tags (v1.2.3) publish that version; manual
# runs publish the version in debian/changelog.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: publish-apt
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    # `secrets` isn't allowed in step `if:`; expose them as env and test that.
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require signing key
        if: env.GPG_PRIVATE_KEY == '' || env.GPG_KEY_ID == ''
        run: |
          echo "::error::Set the GPG_PRIVATE_KEY and GPG_KEY_ID secrets (see README: Publishing the deb)."
          exit 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper devscripts dpkg-dev apt-utils

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEBEMAIL: bluelock@users.noreply.github.com
          DEBFULLNAME: BlueLock CI
        run: |
          version="${GITHUB_REF_NAME#v}"
          dch -b --newversion "${version}-1" --distribution noble --force-distribution "Release $version"

      - name: Build deb
        run: dpkg-buildpackage -us -uc -b

      - name: Import GPG key
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build signed repo
        run: ./scripts/build_apt_repo.sh repo ../bluelock_*_all.deb

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: repo
          force_orphan: true
